name: PR title

on:
  pull_request_target: # zizmor: ignore[dangerous-triggers]
    types: [opened, edited, reopened, synchronize]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # `pull_request_target` runs in the base's context, so `github.ref` is
  # the base branch and every open PR would share one group.
  cancel-in-progress: ${{ github.event_name == 'pull_request_target' }}

permissions:
  pull-requests: read

jobs:
  title:
    name: PR title
    uses: FerrLabs/.github/.github/workflows/reusable-pr-title.yml@539e9aca37e08abde8d9cefbe13cd98fa62b1b41 # main
    with:
      runner: ubuntu-latest
