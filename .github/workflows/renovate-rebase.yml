name: Renovate rebase now

on:
  pull_request:
    types: [edited]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  dispatch:
    uses: FerrLabs/.github/.github/workflows/reusable-renovate-dispatch.yml@fba6f4be8621a4d54b0c34b18cc7efd5fb67a1e5 # main
    with:
      # This repo is public, so the job cannot use the default `ferrlabs-k8s`
      # runner: that group sets `allows_public_repositories=false`, which is
      # what keeps public-repo workflows away from the cluster.
      runner: ubuntu-latest
    secrets: inherit
