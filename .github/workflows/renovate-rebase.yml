name: Renovate rebase now

on:
  pull_request:
    types: [edited]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  dispatch:
    uses: FerrLabs/.github/.github/workflows/reusable-renovate-dispatch.yml@539e9aca37e08abde8d9cefbe13cd98fa62b1b41 # main
    with:
      # This repo is public, so the job cannot use the default `ferrlabs-k8s`
      # runner: that group sets `allows_public_repositories=false`, which is
      # what keeps public-repo workflows away from the cluster.
      runner: ubuntu-latest
    secrets: inherit
