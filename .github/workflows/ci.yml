name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run'
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Cancel superseded pull request runs. Never on a push to main: this
  # workflow releases, so a burst of merges queues instead, which bounds
  # it at one running and one pending release rather than one per merge.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    permissions:
      contents: read
      pull-requests: write
      packages: read
    name: Test
    uses: FerrLabs/.github/.github/workflows/reusable-ci-node.yml@84f44470a9ff640ea8bb32efc74d45f912660d71 # main
    with:
      enable-sonar: true
      install-args: ''
      enable-lint: false
      enable-knip: true
      enable-madge: true
      madge-paths: packages/*/src
      enable-audit: true
    secrets: inherit

  release:
    name: Release
    needs: test
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.test.result == 'success') || (github.event_name == 'workflow_dispatch' && needs.test.result == 'success')
    permissions:
      contents: write
      id-token: write
    uses: FerrLabs/.github/.github/workflows/reusable-ferrflow-release.yml@84f44470a9ff640ea8bb32efc74d45f912660d71 # main
    with:
      dry-run: ${{ inputs.dry_run || false }}
    secrets: inherit
